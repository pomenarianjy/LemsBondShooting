<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>007 Lems Bond: The Better Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('Back1.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Darkened overlay for background */
        #game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            pointer-events: none;
            z-index: 1;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .hidden {
            display: none !important;
        }

        /* Start Screen */
        #start-screen {
            background-image: url('startbond.png');
            background-color: #000;
        }

        #game-title {
            position: absolute;
            top: 15%;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            z-index: 12;
            transition: opacity 0.5s ease;
            padding: 0 20px;
        }

        #game-title h1 {
            font-size: clamp(2.2rem, 6vw, 3.5rem);
            margin: 0;
            letter-spacing: 2px;
        }

        #game-title h2 {
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            margin: 10px 0 0 0;
            color: #ccc;
        }

        /* Smoke Transition Overlay */
        #smoke-overlay {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(255,255,255,1) 0%, rgba(240,240,240,0.95) 50%, rgba(255,255,255,0) 100%);
            z-index: 20;
            transition: bottom 2s ease-in-out;
            pointer-events: none;
        }

        #smoke-overlay.active {
            bottom: 0%;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            color: #fff;
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-weight: bold;
            z-index: 5;
            text-shadow: 2px 2px 4px #000;
            padding: 0 10px;
        }

        /* Grid Layouts - Spaced Out & Uniform Tilt */
        .grid {
            position: relative;
            z-index: 5;
            display: grid;
            justify-content: center;
            align-content: center;
            width: 90vw;
            max-width: 850px;
            height: 72vh;
            max-height: 720px;
        }

        .grid-3 {
            grid-template-columns: repeat(3, minmax(90px, 1fr));
            grid-template-rows: repeat(3, minmax(90px, 1fr));
            gap: clamp(25px, 5vw, 45px);
        }

        .grid-4 {
            grid-template-columns: repeat(4, minmax(75px, 1fr));
            grid-template-rows: repeat(4, minmax(75px, 1fr));
            gap: clamp(18px, 4vw, 35px);
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slot {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.1s;
            /* All guns tilted into the exact same angle (-5deg) */
            transform: rotate(-5deg);
        }

        /* Specific fix for bondwithgun to make it properly sized and match/exceed gun footprint */
        .slot.is-bond {
            background-size: contain;
            transform: rotate(-5deg) scale(1.15); /* Slightly larger than normal guns */
        }

        .slot:active {
            transform: scale(0.95) rotate(-5deg);
        }

        /* Loss Screen / Kidnap */
        #loss-screen {
            background-color: #000;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: zoomOutEffect 1.5s forwards;
        }

        @keyframes zoomOutEffect {
            0% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .loss-text {
            position: absolute;
            bottom: 12%;
            color: #ff3333;
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: bold;
            text-shadow: 3px 3px 6px #000;
            text-align: center;
            animation: pulseText 1s infinite alternate;
            padding: 0 10px;
        }

        @keyframes pulseText {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Level Cleared & Congrats Screens */
        .fullscreen-msg {
            background-color: #000;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .banner-text {
            position: absolute;
            top: 5%;
            background: rgba(0, 0, 0, 0.8);
            color: #00ffcc;
            padding: 8px 20px;
            font-size: clamp(1.2rem, 4vw, 2rem);
            border-radius: 8px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
            text-align: center;
        }

        .instruction-prompt {
            position: absolute;
            bottom: 5%;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: clamp(0.9rem, 3vw, 1rem);
            animation: blink 1s infinite;
            text-align: center;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Gunshot Flash Effect */
        #shot-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.4);
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
        #shot-flash.flash {
            opacity: 1;
        }

        canvas#fireworks {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="shot-flash"></div>
    <div id="smoke-overlay"></div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen" onclick="handleStartClick()">
        <div id="game-title">
            <h1>007 Lems Bond</h1>
            <h2>The Better Shooter</h2>
        </div>
        <div class="instruction-prompt" style="bottom: 10%;">Click anywhere to begin</div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div id="hud-level">Level: 1</div>
        <div id="hud-lives">Fails: 0/3</div>
        <div id="hud-timer">Time: 60s</div>
    </div>

    <!-- Game Board Grid -->
    <div id="game-board" class="hidden">
        <div id="grid-element" class="grid"></div>
    </div>

    <!-- Loss / Kidnap Screen -->
    <div id="loss-screen" class="screen hidden" onclick="handleLossClick()">
        <div id="loss-msg-container" class="loss-text">You are kidnapped!</div>
        <div class="instruction-prompt">Click to continue</div>
    </div>

    <!-- Level Clear Screen -->
    <div id="clear-screen" class="screen hidden" onclick="handleClearClick()" style="background-image: url('clear.png');">
        <div class="banner-text">Level Cleared!</div>
        <div class="instruction-prompt">Click to proceed to next level</div>
    </div>

    <!-- Level Clear 2 Screen -->
    <div id="clear2-screen" class="screen hidden" onclick="handleClearClick()" style="background-image: url('clear2.png');">
        <div class="banner-text">Level Cleared!</div>
        <div class="instruction-prompt">Click to proceed to next level</div>
    </div>

    <!-- Victory Screen -->
    <div id="congrats-screen" class="screen hidden" onclick="location.reload()" style="background-image: url('congrats.png');">
        <canvas id="fireworks"></canvas>
        <div class="banner-text" style="color: #ffd700; border-color: #ffd700; box-shadow: 0 0 15px #ffd700;">All Missions Accomplished!</div>
        <div class="instruction-prompt">Click anywhere to restart game</div>
    </div>
</div>

<script>
    let currentStep = 0; 
    let currentLevel = 1;
    let fails = 0;
    let timer = 60;
    let timerInterval = null;
    let activeBonds = {}; // Map slotIndex -> timeoutId for individual active bonds
    let gameActive = false;
    let lossStatePhase = 0; 

    const startScreen = document.getElementById('start-screen');
    const gameTitle = document.getElementById('game-title');
    const smokeOverlay = document.getElementById('smoke-overlay');
    const hud = document.getElementById('hud');
    const gameBoard = document.getElementById('game-board');
    const gridElement = document.getElementById('grid-element');
    const hudLevel = document.getElementById('hud-level');
    const hudLives = document.getElementById('hud-lives');
    const hudTimer = document.getElementById('hud-timer');
    const lossScreen = document.getElementById('loss-screen');
    const lossMsgContainer = document.getElementById('loss-msg-container');
    const clearScreen = document.getElementById('clear-screen');
    const clear2Screen = document.getElementById('clear2-screen');
    const congratsScreen = document.getElementById('congrats-screen');
    const shotFlash = document.getElementById('shot-flash');

    function handleStartClick() {
        if (currentStep === 0) {
            gameTitle.style.opacity = '0';
            currentStep = 1;
        } else if (currentStep === 1) {
            currentStep = 2;
            smokeOverlay.classList.add('active');
            setTimeout(() => {
                startScreen.classList.add('hidden');
                smokeOverlay.classList.remove('active');
                smokeOverlay.style.bottom = '-100%';
                initGame();
            }, 2000);
        }
    }

    function initGame() {
        hud.classList.remove('hidden');
        gameBoard.classList.remove('hidden');
        loadLevel(currentLevel);
    }

    function loadLevel(level) {
        currentLevel = level;
        fails = 0;
        timer = 60;
        gameActive = true;
        clearAllBonds();
        updateHud();

        gridElement.innerHTML = '';
        // Level 1 & 2: 3*3 grid. Level 3 & 4: 4*4 grid.
        if (currentLevel <= 2) {
            gridElement.className = 'grid grid-3';
            createGridSlots(9);
        } else {
            gridElement.className = 'grid grid-4';
            createGridSlots(16);
        }

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timer--;
            updateHud();
            if (timer <= 0) {
                winLevel();
            }
        }, 1000);

        scheduleNextSpawn();
    }

    function updateHud() {
        hudLevel.innerText = `Level: ${currentLevel}`;
        hudLives.innerText = `Fails: ${fails}/3`;
        hudTimer.innerText = `Time: ${timer}s`;
    }

    function createGridSlots(count) {
        for (let i = 0; i < count; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'slot-wrapper';

            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.style.backgroundImage = "url('gun.png')";
            slot.dataset.index = i;
            
            slot.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handleSlotClick(i);
            });

            wrapper.appendChild(slot);
            gridElement.appendChild(wrapper);
        }
    }

    function getSpawnDelay() {
        const delays = [0, 2000, 1500, 1100, 800];
        return delays[currentLevel] || 800;
    }

    function scheduleNextSpawn() {
        if (!gameActive) return;

        let delay = Math.random() * 600 + getSpawnDelay();
        setTimeout(() => {
            if (!gameActive) return;
            spawnBond();
            scheduleNextSpawn();
        }, delay);
    }

    function spawnBond() {
        if (!gameActive) return;

        const totalSlots = currentLevel <= 2 ? 9 : 16;
        let maxSimultaneous = (currentLevel === 4) ? 2 : 1;

        let availableSlots = [];
        const slots = document.querySelectorAll('.slot');

        for (let i = 0; i < totalSlots; i++) {
            if (!(i in activeBonds) && !slots[i].classList.contains('is-bond')) {
                availableSlots.push(i);
            }
        }

        // Spawn up to maxSimultaneous bonds if slots are available
        let currentSpawnCount = Object.keys(activeBonds).length;
        let canSpawn = Math.min(maxSimultaneous - currentSpawnCount, availableSlots.length);

        for (let s = 0; s < canSpawn; s++) {
            if (availableSlots.length === 0) break;
            let randIdx = Math.floor(Math.random() * availableSlots.length);
            let slotIndex = availableSlots.splice(randIdx, 1)[0];

            let slot = slots[slotIndex];
            slot.style.backgroundImage = "url('bondwithgun.png')";
            slot.classList.add('is-bond');

            // 2 seconds to shoot before player gets hit
            let bondTimer = setTimeout(() => {
                if (!gameActive) return;
                // If this specific bond hasn't been clicked in time, player gets shot!
                triggerShotAnimation();
            }, 2000);

            activeBonds[slotIndex] = bondTimer;
        }
    }

    function clearAllBonds() {
        for (let idx in activeBonds) {
            clearTimeout(activeBonds[idx]);
        }
        activeBonds = {};
    }

    function handleSlotClick(index) {
        if (!gameActive) return;

        const slots = document.querySelectorAll('.slot');
        let slot = slots[index];

        // Check if player clicked an active bond in time
        if (index in activeBonds) {
            clearTimeout(activeBonds[index]);
            delete activeBonds[index];

            slot.style.backgroundImage = "url('gun.png')";
            slot.classList.remove('is-bond');

            if (timer <= 0) {
                winLevel();
            }
        }
    }

    function triggerShotAnimation() {
        gameActive = false;
        clearAllBonds();
        clearInterval(timerInterval);

        // Flash screen red
        shotFlash.classList.add('flash');
        setTimeout(() => {
            shotFlash.classList.remove('flash');
        }, 200);

        fails++;
        updateHud();

        setTimeout(() => {
            if (fails >= 3) {
                showLossScreen();
            } else {
                const slots = document.querySelectorAll('.slot');
                slots.forEach(slot => {
                    slot.style.backgroundImage = "url('gun.png')";
                    slot.classList.remove('is-bond');
                });

                gameActive = true;
                timerInterval = setInterval(() => {
                    timer--;
                    updateHud();
                    if (timer <= 0) winLevel();
                }, 1000);
                scheduleNextSpawn();
            }
        }, 800);
    }

    function winLevel() {
        gameActive = false;
        clearAllBonds();
        clearInterval(timerInterval);
        hud.classList.add('hidden');
        gameBoard.classList.add('hidden');

        if (currentLevel === 2) {
            clear2Screen.classList.remove('hidden');
        } else if (currentLevel === 1 || currentLevel === 3) {
            clearScreen.classList.remove('hidden');
        } else if (currentLevel >= 4) {
            congratsScreen.classList.remove('hidden');
            startFireworks();
        }
    }

    function handleClearClick() {
        clearScreen.classList.add('hidden');
        clear2Screen.classList.add('hidden');
        currentLevel++;
        initGame();
    }

    function showLossScreen() {
        lossStatePhase = 0;
        lossScreen.style.backgroundImage = "url('lost.png')";
        lossMsgContainer.innerText = "You are kidnapped!";
        lossMsgContainer.style.display = "block";
        lossScreen.classList.remove('hidden');
        hud.classList.add('hidden');
        gameBoard.classList.add('hidden');
    }

    function handleLossClick() {
        if (lossStatePhase === 0) {
            lossStatePhase = 1;
            lossScreen.style.backgroundImage = "url('kidnap1.png')";
            lossMsgContainer.style.display = "none";
        } else if (lossStatePhase === 1) {
            lossScreen.classList.add('hidden');
            initGame();
        }
    }

    function startFireworks() {
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        function createFirework(x, y) {
            let particleCount = 100;
            for (let i = 0; i < particleCount; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 6 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    decay: Math.random() * 0.015 + 0.01,
                    color: `hsl(${Math.random() * 30 + 40}, 100%, 50%)`
                });
            }
        }

        let fwInterval = setInterval(() => {
            if (congratsScreen.classList.contains('hidden')) {
                clearInterval(fwInterval);
                return;
            }
            createFirework(Math.random() * canvas.width, Math.random() * (canvas.height * 0.6));
        }, 800);

        function animateFireworks() {
            if (congratsScreen.classList.contains('hidden')) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            requestAnimationFrame(animateFireworks);
        }

        animateFireworks();
    }
</script>

</body>
</html>
